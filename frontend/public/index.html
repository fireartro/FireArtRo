        <script>
            (() => {
                const ua = navigator.userAgent || "";
                const isiOS =
                    /iPad|iPhone|iPod/.test(ua) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
                const isSafari =
                    /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|SamsungBrowser/.test(ua);
                const isMac = /Macintosh|MacIntel|MacPPC|Mac68K/.test(
                    navigator.platform || ua
                );
                if (isiOS || isMac) {
                    document.documentElement.dataset.applePlatform = "true";
                }
                if (isiOS || isSafari) {
                    document.documentElement.dataset.appleWebkit = "true";
                }
            })();
        </script>
