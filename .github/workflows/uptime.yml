name: Production uptime

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fireartro-production-uptime
  cancel-in-progress: true

jobs:
  verify:
    name: Public site and API health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify production endpoints
        run: node scripts/verify-production.mjs
