name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt
      - name: Run tests
        run: PYTHONPATH=backend python -m pytest backend/tests -q

  frontend:
    name: Frontend and API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: corepack enable && yarn --cwd frontend install --frozen-lockfile
      - name: Run API tests
        run: npm run test:api
      - name: Run frontend tests
        run: yarn --cwd frontend test --watchAll=false --runInBand
        env:
          CI: "true"
      - name: Build frontend
        run: yarn --cwd frontend build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
